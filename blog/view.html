<!DOCTYPE html>
<html lang="en" class="blog-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ff2d55">
  <meta id="robotsMeta" name="robots" content="noindex, nofollow">
  <title>Blog</title>
  <link rel="stylesheet" href="blog.css?v=7">
</head>
<body class="blog-page">
  <article class="blog-article" id="article" hidden>
    <div class="blog-article-top">
      <a class="feature-back" id="backLink" href="/">Back to portal</a>
    </div>
    <div class="page-mark-row blog-article-title">
      <img class="page-mark" src="/icons/apps/blog.svg" alt="">
      <h1 id="titleEl"></h1>
    </div>
    <div class="blog-article-meta" id="metaEl"></div>
    <div class="blog-md" id="bodyEl"></div>
    <div class="blog-like-bar" id="likeBar" hidden>
      <button type="button" class="blog-like-btn" id="likeBtn">Like</button>
      <span class="blog-like-count" id="likeCount"></span>
    </div>
  </article>
  <p class="blog-empty" id="errBox" hidden style="padding-top:48px"></p>
  <script src="/js/edgeBack.js"></script>
  <script type="module" src="view.js?v=3"></script>
</body>
</html>
