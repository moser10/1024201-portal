<!DOCTYPE html>
<html lang="en" class="feature-page blog-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ff2d55">
  <meta name="robots" content="noindex, nofollow">
  <title>Blog | 1024201</title>
  <link rel="modulepreload" href="/js/langTabs.js">
  <link rel="stylesheet" href="/js/langTabs.css">
  <link rel="stylesheet" href="/js/featurePage.css?v=2">
  <link rel="stylesheet" href="blog.css?v=2">
</head>
<body class="feature-page blog-page" data-tool="blog">
  <div class="feature-shell">
    <div class="feature-main">
      <div class="feature-top">
        <a class="feature-back" id="backLink" href="/">Portal</a>
        <div id="langSlot"></div>
      </div>
      <div class="feature-card">
        <div class="feature-card-head">
          <h1 id="pageTitle">Blog</h1>
          <p class="sub" id="pageSub"></p>
          <p class="tool-user" id="userLine" hidden></p>
        </div>

        <div class="blog-toolbar" id="toolbar" hidden>
          <button type="button" class="btn-primary" id="newBtn">New post</button>
        </div>

        <div id="listWrap" hidden>
          <ul class="blog-list" id="blogList"></ul>
          <p class="blog-empty" id="emptyBox" hidden></p>
        </div>

        <div class="login-panel" id="loginPanel" hidden>
          <p id="loginDesc"></p>
          <a class="btn-primary btn-link" id="loginBtn" href="/game/register/">Sign in</a>
        </div>

        <p class="err" id="errBox" hidden></p>
      </div>
    </div>
  </div>
  <script type="module" src="blog.js?v=3"></script>
  <script src="/js/edgeBack.js"></script>
</body>
</html>
