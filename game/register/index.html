<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2B3054">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="1042">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/apps/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>注册账户</title>
  <style>html,body{background:#2B3054}#authBoot{max-width:420px;margin:24px auto;padding:24px 20px;border-radius:14px;background:#fff;color:#8e8e93;font:14px -apple-system,BlinkMacSystemFont,sans-serif;text-align:center}</style>
  <link rel="stylesheet" href="auth.css?v=6">
  <link rel="stylesheet" href="/js/langTabs.css?v=4">
  <link rel="stylesheet" href="/js/accountChrome.css?v=2">
  <link rel="stylesheet" href="../css/userBar.css?v=11">
</head>
<body>
  <div id="app"><div id="authBoot">正在打开账户页面…</div></div>
  <script>
    // iOS home-screen recovery: never strand an already-authenticated user here.
    (function () {
      try {
        var user = JSON.parse(localStorage.getItem("osn_user") || "null");
        if (!user || !user.id) return;
        var raw = new URLSearchParams(location.search).get("return") || "/";
        var dest = raw.charAt(0) === "/" ? raw : "/" + raw;
        if (dest.indexOf("/register") !== -1) dest = "/";
        location.replace(dest);
      } catch (_) {}
    })();
  </script>
  <script type="module" src="auth.js?v=15"></script>
  <script src="/pwa.js" defer></script>
</body>
</html>
