<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#007aff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="1042">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/icons/apps/logo.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <title>游戏中心</title>
    <style>html,body{background:#f2f2f7}body{margin:0}</style>
    <link rel="modulepreload" href="/js/langTabs.js">
    <link rel="modulepreload" href="/js/accountChrome.js">
    <link rel="stylesheet" href="css/hub.css?v=11">
    <link rel="stylesheet" href="/js/featurePage.css?v=5">
    <link rel="stylesheet" href="/js/langTabs.css?v=3">
    <link rel="stylesheet" href="/js/accountChrome.css?v=2">
    <link rel="stylesheet" href="css/userBar.css?v=10">
</head>
<body>
    <div id="app">
      <div class="hub">
        <div class="hub-top">
          <a href="/" class="feature-back" id="hubBack">Back to portal</a>
          <div id="hubAccountChrome" class="hub-account-slot"></div>
        </div>
        <div class="page-mark-row">
          <img class="page-mark" src="/icons/apps/game.svg" alt="">
          <h1 id="hubTitle">游戏中心</h1>
        </div>
        <div class="grid" id="gameGrid">
          <a class="game-card" href="onesentence/" data-href="onesentence/" data-id="osn">
            <div class="game-icon"><img src="/icons/apps/osn.svg" alt=""></div>
            <div class="game-label" data-label="osn">一人一句，一句成书</div>
            <div class="game-full">One Sentence Novel</div>
          </a>
          <a class="game-card" href="paddlemaze/" data-href="paddlemaze/" data-id="paddlemaze">
            <div class="game-icon"><img src="/icons/apps/pbm.svg" alt=""></div>
            <div class="game-label" data-label="paddlemaze">挡板方块迷宫</div>
            <div class="game-full">Paddle Block Maze</div>
          </a>
          <a class="game-card" href="dua/" data-href="dua/" data-id="dua">
            <div class="game-icon"><img src="/icons/apps/dua.svg" alt=""></div>
            <div class="game-label" data-label="dua">对圈</div>
            <div class="game-full">Dua Circle</div>
          </a>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var lang = localStorage.getItem("portal_lang") || "en";
        var text = {
          zh: { title:"游戏中心", back:"返回门户", osn:"一人一句，一句成书", paddlemaze:"挡板方块迷宫", dua:"对圈" },
          en: { title:"Game Center", back:"Back to portal", osn:"One sentence, one novel", paddlemaze:"Paddle Block Maze", dua:"Dua" },
          ja: { title:"ゲームセンター", back:"ポータルへ", osn:"一文執筆", paddlemaze:"パドルブロック迷路", dua:"デュエル円" }
        }[lang] || null;
        if (!text) return;
        document.getElementById("hubTitle").textContent = text.title;
        document.getElementById("hubBack").textContent = text.back;
        document.querySelector('[data-label="osn"]').textContent = text.osn;
        document.querySelector('[data-label="paddlemaze"]').textContent = text.paddlemaze;
        document.querySelector('[data-label="dua"]').textContent = text.dua;
      })();
    </script>
    <script type="module" src="js/hub.js?v=5"></script>
    <script src="/pwa.js" defer></script>
</body>
</html>
