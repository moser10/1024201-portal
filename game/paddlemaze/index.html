<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a12">
  <title>Paddle Block Maze | 1024201</title>
  <link rel="stylesheet" href="/js/featurePage.css?v=2">
  <link rel="stylesheet" href="game.css?v=1">
</head>
<body>
  <main class="game-shell">
    <header class="game-top">
      <a class="game-back" href="/">返回门户</a>
      <div class="game-title">
        <strong>PADDLE BLOCK MAZE</strong>
        <span id="levelText">LEVEL 01 / 24</span>
      </div>
      <button class="icon-btn" id="pauseBtn" type="button" aria-label="暂停">Ⅱ</button>
    </header>

    <section class="hud" aria-label="游戏状态">
      <div><span>目标</span><strong id="brickCount">0</strong></div>
      <div><span>球数</span><strong id="ballCount">1</strong></div>
      <div><span>挡板</span><strong id="paddleCount">1×</strong></div>
      <div><span>得分</span><strong id="scoreCount">0</strong></div>
    </section>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="gameCanvas" width="900" height="620" aria-label="Paddle Block Maze 游戏区域"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <p class="eyebrow" id="overlayEyebrow">PADDLE BLOCK MAZE</p>
          <h1 id="overlayTitle">穿过迷宫，清除目标</h1>
          <p id="overlayText">移动挡板反弹球，让球穿过灰色通道进入砖块区域。</p>
          <button id="startBtn" type="button">开始游戏</button>
        </div>
      </div>
    </div>

    <footer class="game-help">
      <span>拖动 / 鼠标 / ← → 移动挡板</span>
      <span>绿色增强 · 红色削弱</span>
    </footer>
  </main>
  <script type="module" src="game.js?v=1"></script>
</body>
</html>
