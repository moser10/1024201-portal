<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a12">
  <title>Paddle | 1024201</title>
  <link rel="stylesheet" href="/js/featurePage.css?v=7">
  <link rel="stylesheet" href="game.css?v=29">
</head>
<body>
  <main class="game-shell">
    <header class="game-top">
      <a class="game-back" id="gameBack" href="/">Back to lobby</a>
      <div class="game-title">
        <strong id="gameBrand">PADDLE</strong>
        <span id="levelText">LEVEL 01 / 24</span>
      </div>
      <button class="icon-btn" id="pauseBtn" type="button" aria-label="暂停">Ⅱ</button>
    </header>

    <section class="hud" aria-label="游戏状态">
      <div class="hud-stat"><i class="hud-brick" id="targetIcon" aria-label="目标砖块"></i><strong id="brickCount">0</strong></div>
      <div class="hud-stat"><i class="hud-ball" aria-label="球数"></i><strong id="ballCount">1</strong></div>
      <div class="hud-stat" title="挡板长度，1格=一块砖宽">
        <i class="hud-paddle" aria-label="1单位托盘"></i>
        <strong id="paddleCount">5</strong>
        <strong id="paddleCapTime" hidden>0:10</strong>
      </div>
      <div class="hud-stat" title="本关时间"><strong id="runTime">0:00</strong></div>
      <div class="hud-stat hud-welfare" title="福利倒计时">
        <span id="welfarePreview" class="hud-welfare-preview paddle-up" style="color:#30d158" aria-hidden="true">
          <svg viewBox="0 0 48 30"><rect x="3" y="12" width="42" height="7" rx="3.5"/></svg>
        </span>
        <strong id="welfareTime">2:00</strong>
      </div>
    </section>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="gameCanvas" width="900" height="1100" draggable="false" aria-label="Paddle 游戏区域"></canvas>
      <p class="pause-banner" id="pauseBanner" hidden></p>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <p class="eyebrow" id="overlayEyebrow" hidden></p>
          <h1 id="overlayTitle">进入后移动到合适位置，
松手发送弹珠。</h1>
          <p id="overlayText"></p>
          <button id="startBtn" type="button">START</button>
        </div>
      </div>
    </div>

    <div class="control-zone" id="controlZone" aria-label="挡板控制区域">
      <div class="resource-icons" aria-label="资源图例">
        <svg class="resource-icon paddle-up" style="color:#30d158" viewBox="0 0 48 30" role="img" aria-label="绿色托盘变长"><rect x="3" y="12" width="42" height="7" rx="3.5"/></svg>
        <svg class="resource-icon paddle-down" style="color:#0a84ff" viewBox="0 0 48 30" role="img" aria-label="蓝色托盘变短"><rect x="15" y="12" width="18" height="7" rx="3.5"/></svg>
        <svg class="resource-icon balls-up" style="color:#ff453a" viewBox="0 0 58 30" role="img" aria-label="红色一球变三球"><circle cx="7" cy="15" r="5"/><path d="M15 15h10m-4-4 4 4-4 4"/><circle cx="34" cy="8" r="4"/><circle cx="34" cy="22" r="4"/><circle cx="46" cy="15" r="4"/></svg>
        <svg class="resource-icon balls-down" style="color:#bf5af2" viewBox="0 0 58 30" role="img" aria-label="紫色球减少"><circle cx="7" cy="8" r="4"/><circle cx="7" cy="22" r="4"/><circle cx="19" cy="15" r="4"/><path d="M26 15h10m-4-4 4 4-4 4"/><circle cx="47" cy="15" r="5"/></svg>
        <svg class="resource-icon reset" style="color:#e6c200" viewBox="0 0 48 30" role="img" aria-label="黄色复位"><rect x="3" y="20" width="22" height="6" rx="3"/><circle cx="37" cy="10" r="5"/><path d="M10 10a11 11 0 0 1 17-4M10 10V5M10 10h5"/></svg>
      </div>
      <div class="control-gap" id="controlGap" aria-hidden="true"></div>
      <div class="control-row" aria-label="滑动控制托盘">
        <span class="control-symbol" aria-hidden="true">‹</span>
        <svg class="control-paddle" viewBox="0 0 84 24" aria-hidden="true"><rect x="8" y="8" width="68" height="8" rx="4"/></svg>
        <span class="control-symbol" aria-hidden="true">›</span>
      </div>
    </div>
  </main>
  <script>
    (function () {
      var lang = localStorage.getItem("portal_lang") || "en";
      var back = { en: "Back to lobby", zh: "返回大厅", ja: "ロビーへ" };
      var name = { zh: "打砖块", en: "Paddle", ja: "ブロック崩し" };
      var serve = {
        zh: "进入后移动到合适位置，\n松手发送弹珠。",
        en: "After you enter, move into place.\nRelease to send the marble.",
        ja: "入ったら位置を合わせ、\n指を離してビー玉を出す。"
      };
      document.getElementById("gameBack").textContent = back[lang] || back.en;
      var brand = name[lang] || name.en;
      document.getElementById("gameBrand").textContent = lang === "en" ? "PADDLE" : brand;
      document.getElementById("overlayTitle").textContent = serve[lang] || serve.en;
      document.title = brand + " | 1024201";
    })();
  </script>
  <script type="module" src="game.js?v=36"></script>
</body>
</html>
