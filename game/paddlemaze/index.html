<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a12">
  <title>Paddle Block Maze | 1024201</title>
  <link rel="stylesheet" href="/js/featurePage.css?v=2">
  <link rel="stylesheet" href="game.css?v=5">
</head>
<body>
  <main class="game-shell">
    <header class="game-top">
      <a class="game-back" href="/">返回门户</a>
      <div class="game-title">
        <strong>PADDLE BLOCK MAZE</strong>
        <span id="levelText">LEVEL 01 / 24</span>
      </div>
      <button class="icon-btn" id="pauseBtn" type="button" aria-label="暂停">Ⅱ</button>
    </header>

    <section class="hud" aria-label="游戏状态">
      <div><span>目标</span><strong id="brickCount">0</strong></div>
      <div><span>球数</span><strong id="ballCount">1</strong></div>
      <div><span>挡板</span><strong id="paddleCount">1×</strong></div>
      <div><span>得分</span><strong id="scoreCount">0</strong></div>
    </section>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="gameCanvas" width="900" height="1100" aria-label="Paddle Block Maze 游戏区域"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <p class="eyebrow" id="overlayEyebrow" hidden></p>
          <h1 id="overlayTitle">Paddle Block Maze<br>挡板方块迷宫<br>パドルブロック迷路</h1>
          <p id="overlayText"></p>
          <button id="startBtn" type="button">START</button>
        </div>
      </div>
    </div>

    <div class="control-zone" id="controlZone" aria-label="挡板控制区域">
      <span class="control-symbol" aria-hidden="true">‹</span>
      <svg class="control-paddle" viewBox="0 0 84 24" aria-label="移动托盘"><rect x="8" y="8" width="68" height="8" rx="4"/></svg>
      <span class="control-symbol" aria-hidden="true">›</span>
      <span class="resource-icons" aria-label="资源图标">
        <svg class="resource-icon paddle-up" viewBox="0 0 44 30" role="img" aria-label="托盘增加"><rect x="5" y="14" width="34" height="7" rx="3.5"/><path d="M22 3v8M18 7h8"/></svg>
        <svg class="resource-icon paddle-down" viewBox="0 0 44 30" role="img" aria-label="托盘减少"><rect x="9" y="14" width="26" height="7" rx="3.5"/><path d="M18 7h8"/></svg>
        <svg class="resource-icon balls-up" viewBox="0 0 44 30" role="img" aria-label="球增加"><circle cx="13" cy="17" r="5"/><circle cx="24" cy="17" r="5"/><path d="M35 7v8M31 11h8"/></svg>
        <svg class="resource-icon balls-down" viewBox="0 0 44 30" role="img" aria-label="球减少"><circle cx="14" cy="17" r="5"/><circle cx="25" cy="17" r="5"/><path d="M31 8h9"/></svg>
        <svg class="resource-icon reset" viewBox="0 0 44 30" role="img" aria-label="复位"><rect x="4" y="19" width="24" height="6" rx="3"/><circle cx="34" cy="11" r="5"/><path d="M10 8a12 12 0 0 1 18-3M10 8V3M10 8h5"/></svg>
      </span>
    </div>
  </main>
  <script type="module" src="game.js?v=5"></script>
</body>
</html>
