<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a12">
  <title>Paddle Block Maze | 1024201</title>
  <link rel="stylesheet" href="/js/featurePage.css?v=3">
  <link rel="stylesheet" href="game.css?v=12">
</head>
<body>
  <main class="game-shell">
    <header class="game-top">
      <a class="game-back" id="gameBack" href="/">Back to portal</a>
      <div class="game-title">
        <strong>PADDLE BLOCK MAZE</strong>
        <span id="levelText">LEVEL 01 / 24</span>
      </div>
      <span aria-hidden="true"></span>
    </header>

    <section class="hud" aria-label="游戏状态">
      <div class="hud-stat"><i class="hud-brick" id="targetIcon" aria-label="目标砖块"></i><strong id="brickCount">0</strong></div>
      <div class="hud-stat"><i class="hud-ball" aria-label="球数"></i><strong id="ballCount">1</strong></div>
      <div class="hud-stat"><i class="hud-paddle" aria-label="挡板长度"></i><strong id="paddleCount">1×</strong></div>
      <button class="hud-pause" id="pauseBtn" type="button" aria-label="暂停">Ⅱ</button>
    </section>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="gameCanvas" width="900" height="1100" aria-label="Paddle Block Maze 游戏区域"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <p class="eyebrow" id="overlayEyebrow" hidden></p>
          <h1 id="overlayTitle">Paddle Block Maze<br>挡板方块迷宫<br>パドルブロック迷路</h1>
          <p id="overlayText"></p>
          <button id="startBtn" type="button">START</button>
        </div>
      </div>
    </div>

    <div class="control-zone" id="controlZone" aria-label="挡板控制区域">
      <div class="resource-legend" aria-label="资源图例 绿红增加 蓝紫减少">
        <span class="legend-chip" style="background:#30d158" title="+ paddle">
          <svg viewBox="0 0 48 22" aria-hidden="true"><rect x="2" y="8" width="44" height="7" rx="3.5" fill="#f5f5f7"/></svg>
          <b>+</b>
        </span>
        <span class="legend-chip" style="background:#0a84ff" title="- paddle">
          <svg viewBox="0 0 48 22" aria-hidden="true"><rect x="14" y="8" width="20" height="7" rx="3.5" fill="#f5f5f7"/></svg>
          <b>−</b>
        </span>
        <span class="legend-chip legend-chip-wide" style="background:#ff453a" title="+ balls">
          <svg viewBox="0 0 52 22" aria-hidden="true"><circle cx="8" cy="11" r="4" fill="#f5f5f7"/><circle cx="20" cy="11" r="4" fill="#f5f5f7"/><circle cx="32" cy="11" r="4" fill="#f5f5f7"/></svg>
          <b>+</b>
        </span>
        <span class="legend-chip legend-chip-wide" style="background:#bf5af2" title="- balls">
          <svg viewBox="0 0 52 22" aria-hidden="true"><circle cx="20" cy="11" r="4" fill="#f5f5f7"/></svg>
          <b>−</b>
        </span>
        <span class="legend-chip" style="background:#e6c200" title="reset">
          <b>♻️</b>
        </span>
      </div>
      <div class="control-row" aria-label="滑动控制托盘">
        <span class="control-symbol" aria-hidden="true">‹</span>
        <svg class="control-paddle" viewBox="0 0 84 24" aria-hidden="true"><rect x="8" y="8" width="68" height="8" rx="4"/></svg>
        <span class="control-symbol" aria-hidden="true">›</span>
      </div>
    </div>
  </main>
  <script>
    (function () {
      var lang = localStorage.getItem("portal_lang") || "en";
      var copy = { en: "Back to portal", zh: "返回门户", ja: "ポータルへ" };
      document.getElementById("gameBack").textContent = copy[lang] || copy.en;
    })();
  </script>
  <script type="module" src="game.js?v=12"></script>
</body>
</html>
