<!DOCTYPE html>
<html lang="en" class="feature-page" style="background:#f2f2f7">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f2f2f7">
  <title>Rooms | 1024201</title>
  <style>html,body{background:#f2f2f7}</style>
  <link rel="modulepreload" href="/js/langTabs.js">
  <link rel="stylesheet" href="/js/langTabs.css?v=4">
  <link rel="stylesheet" href="/js/featurePage.css?v=9">
  <link rel="stylesheet" href="/js/accountChrome.css?v=2">
  <link rel="stylesheet" href="rooms.css?v=7">
</head>
<body class="feature-page">
  <div class="feature-shell">
    <div class="feature-main">
      <div class="feature-top">
        <a class="feature-back" id="backLink" href="/">Back to lobby</a>
        <div id="accountSlot"></div>
      </div>
      <div class="feature-card rooms-card">
        <div class="feature-card-head">
          <div class="page-mark-row">
            <img class="page-mark" src="/icons/apps/rooms.svg" alt="">
            <h1 id="pageTitle">Rooms</h1>
          </div>
          <p class="sub" id="pageSub"></p>
        </div>
        <div class="feature-scroll-panel" id="roomsRoot"></div>
      </div>
    </div>
  </div>
  <div class="portal-modal" id="closeAsk" hidden>
    <div class="portal-modal-card">
      <p id="closeAskText"></p>
      <div class="rooms-actions">
        <button type="button" class="btn-secondary" id="closeNo"></button>
        <button type="button" class="btn-danger" id="closeYes"></button>
      </div>
    </div>
  </div>
  <div class="portal-modal" id="gameAsk" hidden>
    <div class="portal-modal-card">
      <p id="gameAskTitle"></p>
      <button type="button" class="rooms-game-opt" id="gameOptDua" data-game="dua">
        <span id="gameOptDuaLabel"></span>
        <span aria-hidden="true">✓</span>
      </button>
    </div>
  </div>
  <script type="module" src="rooms.js?v=10"></script>
</body>
</html>
