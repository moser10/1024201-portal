<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#f2f2f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="1042">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/icons/apps/logo.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <title>1024201 | Portal</title>
    <style>
        @view-transition { navigation: auto; }
        html { background: #f2f2f7; }
        :root {
            --ios-bg: #f2f2f7;
            --ios-card: #ffffff;
            --ios-text: #000000;
            --ios-text-secondary: #8e8e93;
            --ios-blue: #E07A3D;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans", "Yu Gothic UI", "Noto Sans CJK SC", Roboto, "Helvetica Neue", Arial, sans-serif; }

        body {
            background-color: var(--ios-bg);
            color: var(--ios-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; z-index: 2; gap: 10px; position: relative; margin-inline: auto; }

        .sidebar-widgets {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 200px;
            flex-shrink: 0;
        }

        .widget-card {
            background: #2B3054;
            color: #E8D4B8;
            padding: 12px 14px;
            border-radius: 14px;
            box-shadow: none;
            border: 1px solid rgba(232, 212, 184, 0.28);
        }

        .time-zones { width: 100%; }

        .device-widget {
            min-height: 96px;
            border: 0;
            background: #2B3054;
            box-shadow: none;
        }

        .widget-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #C9B392;
            margin-bottom: 6px;
        }

        .device-location {
            font-size: 13px;
            font-weight: 600;
            color: #E8D4B8;
            line-height: 1.35;
            word-break: break-word;
        }

        .device-location.is-loading { color: #C9B392; font-weight: 500; }

        .ip-line { font-size: 13px; font-weight: 600; line-height: 1.35; word-break: break-word; color: #E8D4B8; }
        .ip-sub { font-size: 11px; color: #C9B392; margin-top: 4px; }
        .ip-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
        .ip-tag {
            font-size: 10px; font-weight: 600; padding: 3px 8px;             border-radius: 6px;
            background: #E8D4B8; color: #2B3054;
        }
        .ip-tag.proxy { background: #E07A3D; color: #F4EFE4; }
        .ip-tag-inline {
            display: inline;
            margin-left: 4ch;
            vertical-align: baseline;
            font-size: 9px;
            padding: 2px 6px;
            white-space: nowrap;
        }
        .purity-pill {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 42px; padding: 3px 8px; border-radius: 6px;
            font-size: 11px; font-weight: 700; color: #fff;
        }
        /* High purity = dark green. Then yellow → red → black (worst). */
        .purity-pill.g1 { background: #0d5c3d; }
        .purity-pill.g2 { background: #34c759; }
        .purity-pill.y1 { background: #ffe566; color: #3d3200; }
        .purity-pill.y2 { background: #e6a800; color: #1a1400; }
        .purity-pill.or { background: #f08500; }
        .purity-pill.rd { background: #e53935; }
        .purity-pill.bk { background: #111111; }

        .zone-date {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(232, 212, 184, 0.22);
            color: #F0C44C;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .zone-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .zone-row {
            display: grid;
            grid-template-columns: 92px 1fr;
            align-items: center;
            gap: 8px;
            padding: 4px 6px;
            border-radius: 8px;
            cursor: pointer;
            min-height: 28px;
        }
        .zone-row:hover { background: rgba(232, 212, 184, 0.12); }
        .zone-row.active { background: #E07A3D; }
        .zone-label {
            font-size: 12px;
            color: #C9B392;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .zone-row.active .zone-label { color: #F4EFE4; font-weight: 600; }
        .zone-time {
            font-size: 13px;
            color: #E8D4B8;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            text-align: right;
            letter-spacing: -0.3px;
        }
        .zone-row.active .zone-time { color: #F4EFE4; }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            flex-shrink: 0;
            gap: 6px;
            min-width: 0;
            min-height: 78px;
            margin-left: auto;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
            max-width: 520px;
            margin: 16px auto 40px;
            position: relative;
            z-index: 1;
        }

        .portal-hero {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .portal-brand-block {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 64px;
            margin-bottom: 40px;
            overflow: visible;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .portal-brand-block a {
            color: inherit;
            text-decoration: none;
            pointer-events: none;
        }

        .portal-watermark {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(96px, 24vw, 200px);
            font-weight: 800;
            letter-spacing: -0.055em;
            line-height: 1;
            color: #E07A3D;
            opacity: 0.16;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }

        .portal-brand {
            position: relative;
            z-index: 1;
            margin: 0;
            font-size: clamp(30px, 8vw, 40px);
            font-weight: 700;
            letter-spacing: -0.045em;
            color: #2B3054;
            -webkit-text-fill-color: #2B3054;
            line-height: 1;
        }

        .device-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(232, 212, 184, 0.22);
        }
        .device-stat {
            min-width: 0;
        }
        .device-stat .widget-label { margin-bottom: 4px; }
        .net-speed, .visit-count {
            font-size: 15px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            letter-spacing: -0.02em;
        }
        .net-speed { color: #C9B392; }
        .net-speed.fast { color: #F0C44C; }
        .net-speed.ok { color: #E8D4B8; }
        .net-speed.slow { color: #E07A3D; }
        .visit-count { color: #F0C44C; }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(3, auto);
            gap: 18px 26px;
            justify-content: center;
            align-items: center;
            width: fit-content;
            margin: 0 auto;
            padding: 22px 28px;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 22px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.05);
        }

        .app-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--ios-text); }
        .app-item.is-slot {
            visibility: hidden;
            pointer-events: none;
        }
        .app-icon { width: 90px; height: 90px; border-radius: 50%; background: #2B3054; box-shadow: 0 8px 24px rgba(20,22,40,0.18); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .app-icon img { width: 100%; height: 100%; display: block; }
        .app-label { margin-top: 10px; font-size: 14px; font-weight: 500; }

        footer { font-size: 12px; color: var(--ios-text-secondary); padding: 10px 0; position: relative; z-index: 1; }

        #userBarSlot { min-height: 36px; display: flex; align-items: center; justify-content: flex-end; }
        #langSlot { min-height: 36px; display: flex; justify-content: flex-end; }
        #userBarSlot .user-bar { align-items: flex-end; }

        @media (max-width: 768px) {
            body {
                padding: max(36px, calc(env(safe-area-inset-top) + 24px)) 16px 20px;
            }

            header {
                display: grid;
                grid-template-columns: auto auto;
                justify-content: space-between;
                align-items: stretch;
                gap: 10px;
                padding-top: 10px;
                margin-top: 4px;
            }

            .sidebar-widgets {
                width: 200px;
                max-width: 200px;
                flex-shrink: 0;
            }

            .controls {
                align-self: start;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                align-items: flex-end;
                gap: 6px;
                padding-top: 0;
            }

            #userBarSlot {
                flex-shrink: 0;
            }

            main {
                max-width: 100%;
                margin: 12px 0 28px;
            }

            .portal-brand-block {
                min-height: 52px;
                margin-bottom: 32px;
            }

            .portal-watermark {
                font-size: clamp(76px, 22vw, 128px);
                opacity: 0.16;
            }

            .portal-brand {
                font-size: clamp(26px, 7.5vw, 32px);
                color: #2B3054;
                -webkit-text-fill-color: #2B3054;
            }

            .app-grid {
                gap: 16px 18px;
                padding: 18px 16px;
                border-radius: 20px;
                width: 100%;
                max-width: 360px;
                grid-template-columns: repeat(3, 1fr);
            }

            .app-icon {
                width: 68px;
                height: 68px;
                border-radius: 50%;
                box-shadow: 0 6px 18px rgba(20,22,40,0.16);
            }

            .app-label {
                margin-top: 8px;
                font-size: 12px;
            }
        }
    </style>
    <link rel="stylesheet" href="/js/langTabs.css?v=4">
    <link rel="stylesheet" href="/game/css/userBar.css?v=12">
</head>
<body>
    <header>
        <div class="sidebar-widgets">
            <div class="widget-card time-zones">
                <div class="zone-date" id="zoneDate">--</div>
                <ul class="zone-list">
                    <li class="zone-row" data-zone="us" data-tz="America/Los_Angeles" data-color="#E8D4B8">
                        <span class="zone-label" id="lbl-us">LA, US</span>
                        <span class="zone-time" id="tz-us">--:--</span>
                    </li>
                    <li class="zone-row" data-zone="jp" data-tz="Asia/Tokyo" data-color="#E07A3D">
                        <span class="zone-label" id="lbl-jp">Tokyo, JP</span>
                        <span class="zone-time" id="tz-jp">--:--</span>
                    </li>
                    <li class="zone-row" data-zone="cn" data-tz="Asia/Shanghai" data-color="#F0C44C">
                        <span class="zone-label" id="lbl-cn">BJ, CN</span>
                        <span class="zone-time" id="tz-cn">--:--</span>
                    </li>
                    <li class="zone-row" data-zone="se" data-tz="Europe/Stockholm" data-color="#F0C44C">
                        <span class="zone-label" id="lbl-se">GOT, SE</span>
                        <span class="zone-time" id="tz-se">--:--</span>
                    </li>
                </ul>
            </div>

            <div class="widget-card device-widget">
                <div class="widget-label" id="locTitle">IP</div>
                <div id="ipWidget">
                    <div class="ip-line is-loading" id="deviceLocation">Locating…</div>
                    <div class="ip-tags" id="ipTags" hidden></div>
                </div>
                <div class="device-stats" id="portalVisits">
                    <div class="device-stat">
                        <div class="widget-label" id="speedLabel">Speed</div>
                        <div class="net-speed" id="netSpeed">—</div>
                    </div>
                    <div class="device-stat">
                        <div class="widget-label" id="visitLabel">Visits</div>
                        <div class="visit-count" id="visitCount">—</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div id="userBarSlot"></div>
            <div id="langSlot"></div>
        </div>
    </header>

    <main>
        <div class="portal-hero">
            <div class="portal-brand-block">
                <div class="portal-watermark" aria-hidden="true"><span x-apple-data-detectors="false">1024201</span></div>
                <h1 class="portal-brand"><span x-apple-data-detectors="false">1024201</span></h1>
            </div>
            <div class="app-grid">
                <a href="https://mail.1024201.com" class="app-item">
                    <div class="app-icon icon-mail">
                        <img src="/icons/apps/mail.svg" alt="">
                    </div>
                    <div class="app-label" id="app-mail">Mail</div>
                </a>
                <a href="/game/" class="app-item" id="appGameLink">
                    <div class="app-icon icon-game">
                        <img src="/icons/apps/game.svg" alt="">
                    </div>
                    <div class="app-label" id="app-game">Game Center</div>
                </a>
                <a href="/fx/" class="app-item">
                    <div class="app-icon icon-fx">
                        <img src="/icons/apps/fx.svg" alt="">
                    </div>
                    <div class="app-label" id="app-fx">Rates</div>
                </a>
                <a href="/tools/" class="app-item" id="appToolsLink">
                    <div class="app-icon icon-tools">
                        <img src="/icons/apps/tools.svg" alt="">
                    </div>
                    <div class="app-label" id="app-tools">Toolbox</div>
                </a>
                <a href="/blog/" class="app-item" id="appBlogLink">
                    <div class="app-icon icon-blog" title="ブログ">
                        <img src="/icons/apps/blog.svg" alt="">
                    </div>
                    <div class="app-label" id="app-blog">Blog</div>
                </a>
                <a href="/rooms/" class="app-item" id="appRoomsLink">
                    <div class="app-icon icon-rooms">
                        <img src="/icons/apps/rooms.svg" alt="">
                    </div>
                    <div class="app-label" id="app-rooms">Rooms</div>
                </a>
            </div>
        </div>
    </main>

    <footer>&copy; 2026 1024201.com</footer>

    <script type="module">
        import { purityClass, shortPlace, formatNetSpeed, speedTone } from '/js/geoDisplay.js?v=3';
        const ZONE_MIGRATE = { bj: 'cn', sk: 'us', db: 'jp', jdm: 'se' };

        const i18n = {
            en: {
                us: 'LA, US', jp: 'Tokyo, JP', cn: 'BJ, CN', se: 'GOT, SE',
                mail: 'Mail', game: 'Game Center', fx: 'Rates', tools: 'Toolbox', blog: 'Blog', rooms: 'Rooms',
                locTitle: 'IP', locating: 'Locating…', locUnavailable: 'Location unavailable',
                netResidential: 'Home', netDatacenter: 'DC', netMobile: 'Mobile',
                purity: 'Purity', proxy: 'VPN', visits: 'Visits', speed: 'Speed'
            },
            ja: {
                us: 'LA, US', jp: 'Tokyo, JP', cn: 'BJ, CN', se: 'GOT, SE',
                mail: 'メール', game: 'ゲームセンター', fx: '為替', tools: 'ツールボックス', blog: 'ブログ', rooms: 'ルーム',
                locTitle: 'IP', locating: '取得中…', locUnavailable: '位置を取得できません',
                netResidential: '回線', netDatacenter: 'DC', netMobile: '携帯',
                purity: '純度', proxy: 'VPN', visits: '訪問', speed: '速度'
            },
            zh: {
                us: 'LA, US', jp: 'Tokyo, JP', cn: 'BJ, CN', se: 'GOT, SE',
                mail: '邮箱', game: '游戏中心', fx: '汇率', tools: '工具箱', blog: '博客', rooms: '开房',
                locTitle: 'IP', locating: '定位中…', locUnavailable: '无法获取位置',
                netResidential: '家庭宽带', netDatacenter: '机房', netMobile: '移动',
                purity: '纯净度', proxy: '代理', visits: '访问', speed: '网速'
            }
        };

        function setLangActive(lang) {
            document.querySelectorAll('#langSlot .lang-tab').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
        }

        function applyI18n(lang) {
            if (!i18n[lang]) lang = 'en';
            const t = i18n[lang];
            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang === 'ja' ? 'ja-JP' : 'en';
            document.getElementById('lbl-us').innerText = t.us;
            document.getElementById('lbl-jp').innerText = t.jp;
            document.getElementById('lbl-cn').innerText = t.cn;
            document.getElementById('lbl-se').innerText = t.se;
            document.getElementById('app-mail').innerText = t.mail;
            document.getElementById('app-game').innerText = t.game;
            document.getElementById('app-fx').innerText = t.fx;
            document.getElementById('app-tools').innerText = t.tools;
            document.getElementById('app-blog').innerText = t.blog;
            const roomsLabel = document.getElementById('app-rooms');
            if (roomsLabel) roomsLabel.innerText = t.rooms;
            document.getElementById('locTitle').innerText = t.locTitle;
            const visitLabel = document.getElementById('visitLabel');
            if (visitLabel) visitLabel.textContent = t.visits;
            const speedLabel = document.getElementById('speedLabel');
            if (speedLabel) speedLabel.textContent = t.speed;
            const locEl = document.getElementById('deviceLocation');
            if (locEl.classList.contains('is-loading')) {
                locEl.innerText = t.locating;
            }
        }

        function netLabel(data, t) {
            if (data.networkType === 'datacenter' || data.hosting) return t.netDatacenter;
            if (data.mobile) return t.netMobile;
            return t.netResidential;
        }

        function buildLocationHtml(data, t) {
            const label = shortPlace(data) || data.label || t.locUnavailable;
            if (!data.proxy) return label;
            return `${label}<span class="ip-tag proxy ip-tag-inline">${t.proxy}</span>`;
        }

        function renderIpWidget(data, t) {
            const locEl = document.getElementById('deviceLocation');
            const tagsEl = document.getElementById('ipTags');
            locEl.classList.remove('is-loading');
            locEl.innerHTML = `${buildLocationHtml(data, t)}<div class="ip-sub">${data.ip || ''}</div>`;
            const purityCls = purityClass(data.purity);
            const tags = `<span class="ip-tag">${netLabel(data, t)}</span><span class="purity-pill ${purityCls}">${t.purity} ${data.purity}%</span>`;
            tagsEl.innerHTML = tags;
            tagsEl.hidden = false;
        }

        function changeLang(lang) {
            if (!i18n[lang]) lang = 'en';
            applyI18n(lang);
            localStorage.setItem('portal_lang', lang);
            setLangActive(lang);
            import('/game/js/userBar.js?v=10').then(({ mountUserBar }) => {
                mountUserBar(document.getElementById('userBarSlot'), { variant: 'ios', returnPath: '/', menu: 'home' });
            });
            updateClocks();
            const cachedGeo = sessionStorage.getItem('portal_geo_v2');
            if (cachedGeo) {
                try {
                    renderIpWidget(JSON.parse(cachedGeo), i18n[lang] || i18n.en);
                    return;
                } catch (_) {}
            }
            loadDeviceLocation();
        }

        const DATE_LOCALE = { zh: 'zh-CN', en: 'en-US', ja: 'ja-JP' };
        let storedZone = localStorage.getItem('portal_date_zone') || 'us';
        let activeDateZone = ZONE_MIGRATE[storedZone] || storedZone;
        if (!['us', 'jp', 'cn', 'se'].includes(activeDateZone)) activeDateZone = 'us';

        function setActiveDateZone(zoneId) {
            activeDateZone = zoneId;
            localStorage.setItem('portal_date_zone', zoneId);
            document.querySelectorAll('.zone-row').forEach((row) => {
                const on = row.dataset.zone === zoneId;
                row.classList.toggle('active', on);
                if (on) row.style.setProperty('--zone-accent', row.dataset.color);
            });
            updateClocks();
        }

        document.querySelectorAll('.zone-row').forEach((row) => {
            row.addEventListener('click', () => setActiveDateZone(row.dataset.zone));
        });

        function updateClocks() {
            const now = new Date();
            const lang = localStorage.getItem('portal_lang') || 'en';
            const timeOpts = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const dateOpts = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };

            document.querySelectorAll('.zone-row').forEach((row) => {
                document.getElementById(`tz-${row.dataset.zone}`).innerText = now.toLocaleTimeString('en-GB', { ...timeOpts, timeZone: row.dataset.tz });
            });

            const activeRow = document.querySelector(`.zone-row[data-zone="${activeDateZone}"]`) || document.querySelector('.zone-row');
            if (!activeRow) return;
            document.getElementById('zoneDate').style.color = activeRow.dataset.color;
            document.getElementById('zoneDate').innerText = now.toLocaleDateString(DATE_LOCALE[lang] || 'en-US', { ...dateOpts, timeZone: activeRow.dataset.tz });
        }

        function paintNetSpeed(text, tone) {
            const el = document.getElementById('netSpeed');
            if (!el || !text) return;
            el.textContent = text;
            el.classList.remove('fast', 'ok', 'slow');
            if (tone) el.classList.add(tone);
            try { sessionStorage.setItem('portal_net_speed', JSON.stringify({ text, tone })); } catch (_) {}
        }

        async function measureSpeed() {
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const mbps = Number(conn?.downlink);
            let rttMs = 0;
            try {
                await fetch(`/api/portal?action=ping&n=${Math.random()}`, { cache: 'no-store' });
                const t0 = performance.now();
                await fetch(`/api/portal?action=ping&n=${Math.random()}`, { cache: 'no-store' });
                rttMs = performance.now() - t0;
            } catch (_) {}
            const sample = rttMs > 0
                ? { rttMs }
                : { mbps: Number.isFinite(mbps) && mbps > 0 ? mbps : undefined };
            paintNetSpeed(formatNetSpeed(sample), speedTone(sample));
        }

        function paintVisitCount(n) {
            const el = document.getElementById('visitCount');
            if (!el || n == null || Number.isNaN(Number(n))) return;
            el.textContent = String(n);
            try { localStorage.setItem('portal_visits_n', String(n)); } catch (_) {}
        }

        // Instant paint from local text cache (GoatCounter-style uniques, not vanity pageviews)
        try {
            const cachedN = localStorage.getItem('portal_visits_n');
            if (cachedN) paintVisitCount(cachedN);
            const cachedSpeed = sessionStorage.getItem('portal_net_speed');
            if (cachedSpeed) {
                try {
                    const parsed = JSON.parse(cachedSpeed);
                    if (parsed && parsed.text) paintNetSpeed(parsed.text, parsed.tone);
                    else paintNetSpeed(cachedSpeed);
                } catch (_) {
                    paintNetSpeed(cachedSpeed);
                }
            }
        } catch (_) {}

        async function syncVisits() {
            let uid = '';
            try {
                const u = JSON.parse(localStorage.getItem('osn_user') || 'null');
                if (u && u.id) uid = String(u.id);
            } catch (_) {}
            try {
                const hitQs = new URLSearchParams({ action: 'visit_hit' });
                if (uid) hitQs.set('user_id', uid);
                const hit = await fetch(`/api/portal?${hitQs}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(uid ? { user_id: Number(uid) } : {}) });
                const data = await hit.json();
                if (data && data.n != null) paintVisitCount(data.n);
            } catch (_) {
                try {
                    const res = await fetch('/api/portal?action=visit_count');
                    const data = await res.json();
                    if (data && data.n != null) paintVisitCount(data.n);
                } catch (_) {}
            }
        }

        async function loadDeviceLocation() {
            const locEl = document.getElementById('deviceLocation');
            const tagsEl = document.getElementById('ipTags');
            const lang = localStorage.getItem('portal_lang') || 'en';
            const t = i18n[lang] || i18n.en;
            try {
                const cached = sessionStorage.getItem('portal_geo_v2');
                if (cached) {
                    renderIpWidget(JSON.parse(cached), t);
                    return;
                }
            } catch (_) {}
            locEl.classList.add('is-loading');
            locEl.innerText = t.locating;
            tagsEl.hidden = true;
            try {
                const res = await fetch('/api/portal?action=geo');
                const data = await res.json();
                try { sessionStorage.setItem('portal_geo_v2', JSON.stringify(data)); } catch (_) {}
                renderIpWidget(data, t);
            } catch (_) {
                locEl.classList.remove('is-loading');
                locEl.innerText = t.locUnavailable;
                tagsEl.hidden = true;
            }
        }

        let savedLang = localStorage.getItem('portal_lang') || 'en';
        if (!i18n[savedLang]) savedLang = 'en';
        setActiveDateZone(activeDateZone);
        updateClocks();
        import('/js/langTabs.js').then(({ mountLangTabs }) => {
            mountLangTabs(document.getElementById('langSlot'), { onChange: changeLang });
            changeLang(savedLang);
        });
        setInterval(updateClocks, 1000);

        const idle = window.requestIdleCallback || ((fn) => setTimeout(fn, 1));
        idle(() => syncVisits(), { timeout: 800 });
        idle(() => measureSpeed(), { timeout: 1200 });
        idle(() => loadDeviceLocation(), { timeout: 2500 });

        window.addEventListener('pageshow', () => {
            import('/game/js/userBar.js?v=10').then(({ mountUserBar }) => {
                mountUserBar(document.getElementById('userBarSlot'), { variant: 'ios', returnPath: '/', menu: 'home' });
            });
        });

        // Warm lightweight destination shells so portal taps paint immediately.
        (function warmDestinationShells() {
            const groups = [
                {
                    link: 'appBlogLink',
                    urls: ['/blog/', '/blog/blog.css?v=9', '/blog/blog-app.js?v=3', '/js/featurePage.css?v=7']
                },
                {
                    link: 'appGameLink',
                    urls: ['/game/', '/game/css/hub.css?v=10', '/game/js/hub.js?v=9', '/js/accountChrome.js?v=3', '/js/langTabs.js', '/js/langTabs.css?v=2']
                },
                {
                    link: 'appToolsLink',
                    urls: ['/tools/', '/game/css/hub.css?v=10', '/tools/css/icons.css', '/tools/js/hub.js?v=9', '/js/accountChrome.js?v=3', '/js/langTabs.js']
                },
                {
                    link: 'appRoomsLink',
                    urls: ['/rooms/', '/rooms/rooms.css?v=5', '/rooms/rooms.js?v=8', '/js/featurePage.css?v=9', '/js/navBack.js?v=3', '/icons/apps/rooms.svg']
                }
            ];
            function prefetch(url) {
                if (document.querySelector(`link[rel="prefetch"][href="${url}"], link[rel="modulepreload"][href="${url}"]`)) return;
                const link = document.createElement('link');
                link.rel = url.endsWith('.js') || url.includes('.js?') ? 'modulepreload' : 'prefetch';
                link.href = url;
                if (link.rel === 'modulepreload') link.as = 'script';
                document.head.appendChild(link);
            }
            const idlePrefetch = window.requestIdleCallback || ((fn) => setTimeout(fn, 1200));
            idlePrefetch(() => groups.flatMap((group) => group.urls).forEach(prefetch), { timeout: 3000 });
            for (const group of groups) {
                const target = document.getElementById(group.link);
                if (!target) continue;
                const warm = () => group.urls.forEach(prefetch);
                target.addEventListener('pointerdown', warm, { passive: true });
                target.addEventListener('mouseenter', warm, { once: true });
            }
        })();
    </script>
    <script src="/js/edgeBack.js" defer></script>
    <script src="/pwa.js" defer></script>
</body>
