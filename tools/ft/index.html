<!DOCTYPE html>
<html lang="en" class="feature-page" style="background:#f2f2f7">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ff9f0a">
  <title>超快传 FT | 1024201</title>
  <style>html,body{background:#f2f2f7}</style>
  <link rel="modulepreload" href="/js/langTabs.js">
  <link rel="stylesheet" href="/js/langTabs.css?v=4">
  <link rel="stylesheet" href="/js/featurePage.css?v=7">
  <link rel="stylesheet" href="ft.css?v=3">
</head>
<body class="feature-page" data-tool="ft">
  <div class="feature-shell">
    <div class="feature-main">
      <div class="feature-top" id="ftTop">
        <a class="feature-back" id="backLink" href="/">Back to lobby</a>
        <div id="langSlot"></div>
      </div>
      <div class="feature-card ft-card">
        <div class="feature-card-head">
          <h1 id="pageTitle">超快传</h1>
          <p class="sub" id="pageSub"></p>
          <p class="tool-user" id="userLine" hidden></p>
        </div>

        <div class="ft-workspace feature-scroll-panel" id="ftWorkspace">
          <div class="login-panel" id="gatePanel" hidden>
            <p id="gateDesc"></p>
            <a class="btn-primary btn-link" id="gateLogin" href="/game/register/">Sign in</a>
          </div>

          <form class="ft-form" id="tvLoginForm" hidden>
            <label class="ft-label" id="lblAccount" for="accountIn">Account</label>
            <input class="ft-input" id="accountIn" type="text" autocomplete="username" required />
            <label class="ft-label" id="lblPass" for="passIn">Password</label>
            <input class="ft-input" id="passIn" type="password" autocomplete="current-password" required />
            <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
          </form>

          <div id="appWrap" hidden>
            <p class="ft-space" id="spaceLine"></p>
            <div class="ft-actions" id="deskActions">
              <button type="button" class="btn-primary" id="uploadBtn">Upload</button>
              <button type="button" class="btn-secondary" id="exitBtn">Exit</button>
            </div>
            <input type="file" id="fileIn" hidden />
            <ul class="ft-list" id="fileList"></ul>
            <p class="ft-empty" id="emptyBox" hidden></p>
          </div>
        </div>
        <p class="err" id="errBox" hidden></p>
      </div>
    </div>
  </div>
  <script src="/js/edgeBack.js"></script>
  <script type="module" src="ft.js?v=3"></script>
</body>
</html>
