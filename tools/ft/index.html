<!DOCTYPE html>
<html lang="en" class="feature-page" style="background:#f2f2f7">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ff9f0a">
  <title>超快传 Fast Transfer 超速転送 | 1024201</title>
  <style>html,body{background:#f2f2f7}</style>
  <link rel="modulepreload" href="/js/langTabs.js">
  <link rel="stylesheet" href="/js/langTabs.css?v=4">
  <link rel="stylesheet" href="/js/featurePage.css?v=10">
  <link rel="stylesheet" href="ft.css?v=18">
  <script>
    (function () {
      var tv = /(?:\?|&)client=tv(?:&|$)/.test(location.search) || /1024201-FT-TV/i.test(navigator.userAgent || "");
      if (!tv) return;
      document.documentElement.classList.add("ft-tv");
      document.addEventListener("DOMContentLoaded", function () {
        document.body.classList.add("ft-tv");
        var t = document.getElementById("pageTitle");
        if (t) t.textContent = "超快传 / Fast Transfer / 超速転送";
        var sub = document.getElementById("pageSub");
        if (sub) {
          sub.textContent = "";
          sub.hidden = true;
        }
        var form = document.getElementById("tvLoginForm");
        if (form) form.setAttribute("hidden", "");
        var top = document.getElementById("ftTop");
        var apk = document.getElementById("apkLink");
        if (top) top.remove();
        if (apk) apk.remove();
      });
    })();
  </script>
</head>
<body class="feature-page" data-tool="ft">
  <div class="feature-shell">
    <div class="feature-main">
      <div class="feature-top" id="ftTop">
        <a class="feature-back" id="backLink" href="/">Back to lobby</a>
        <div id="langSlot"></div>
      </div>
      <div class="feature-card ft-card">
        <div class="feature-card-head">
          <h1 id="pageTitle">Fast Transfer</h1>
          <p class="sub" id="pageSub"></p>
          <p class="tool-user" id="userLine" hidden></p>
        </div>

        <div class="ft-workspace feature-scroll-panel" id="ftWorkspace">
          <div class="login-panel" id="gatePanel" hidden>
            <a class="btn-primary btn-link" id="gateLogin" href="/game/register/">Sign in</a>
          </div>

          <form class="ft-form" id="tvLoginForm" hidden>
            <label class="ft-label" id="lblAccount" for="accountIn">Account</label>
            <input class="ft-input" id="accountIn" type="text" autocomplete="username" required />
            <label class="ft-label" id="lblPass" for="passIn">Password</label>
            <input class="ft-input" id="passIn" type="password" autocomplete="current-password" required />
            <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
          </form>
          <p class="err" id="errBox" hidden></p>

          <div id="appWrap" hidden>
            <div class="ft-quota">
              <div class="ft-hp" id="hpBar" aria-hidden="true"><span class="ft-hp-fill" id="hpFill"></span></div>
              <p class="ft-space" id="spaceLine"></p>
            </div>
            <div class="ft-actions" id="deskActions">
              <label class="btn-primary ft-upload-lab" id="uploadLab">
                <span id="uploadLabText">Upload</span>
                <input type="file" id="fileIn" />
              </label>
              <button type="button" class="btn-secondary" id="exitBtn">Exit</button>
            </div>
            <ul class="ft-list" id="fileList"></ul>
            <p class="ft-empty" id="emptyBox" hidden></p>
            <button type="button" class="btn-secondary ft-retry" id="retryList" hidden>Retry</button>
            <div class="ft-update-wrap" id="ftUpdateWrap" hidden>
              <button type="button" class="ft-update-btn is-off" id="ftUpdateBtn" disabled>暂无更新</button>
              <p class="ft-update-sub" id="ftUpdateSub">暂无更新</p>
            </div>
          </div>

          <a class="btn-secondary btn-link ft-apk" id="apkLink" href="/tools/ft/dist/ft-tv-debug.apk?v=1.9" download="ft-tv-1.9.apk">Download projector/TV APK 1.9</a>
        </div>
      </div>
    </div>
  </div>
  <div id="ftBusy" class="ft-busy" hidden>
    <img class="ft-busy-icon" src="/icons/apps/ft.svg?v=3" alt="">
    <p id="ftBusyText">更新中…</p>
  </div>
  <script>
    (function () {
      var tv = document.documentElement.classList.contains("ft-tv");
      if (!tv) {
        var edge = document.createElement("script");
        edge.src = "/js/edgeBack.js";
        document.body.appendChild(edge);
      }
      var s = document.createElement("script");
      if (tv) {
        s.src = "ft-tv.js?v=7";
      } else {
        s.type = "module";
        s.src = "ft.js?v=16";
      }
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
